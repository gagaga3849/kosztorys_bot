name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kosztorys_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:55432/kosztorys_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:55432/kosztorys_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2 \
            shared-mime-info fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply Alembic migrations (schema sanity check)
        run: alembic upgrade head

      - name: Run test suite
        run: python -m pytest tests/ -q
